{% if form.non_field_errors %}<div class="form-alert" role="alert">{{ form.non_field_errors }}</div>{% endif %}
<div class="form-fields">
{% for field in form %}
<div class="form-field{% if field.errors %} has-error{% endif %} field-{{ field.name }}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %}<span class="optional">Optional</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
</div>
